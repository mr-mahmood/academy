services:
  postgres:
    image: postgres:17
    container_name: academy_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 60s
      timeout: 10s
      retries: 5


  redis:
    image: redis:latest
    container_name: academy_redis
    restart: unless-stopped
    networks:
      - academy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3


  backend:
    image: mrmahmood/academy-backend:latest
    container_name: academy_backend
    restart: unless-stopped
    volumes:
      - backend_static:/app/static
      - backend_media:/app/media
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    networks:
      - academy_network
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
      "

  celery:
    image: mrmahmood/academy-backend:latest
    container_name: academy_celery
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - academy_network
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: mrmahmood/academy-frontend:latest
    container_name: academy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - academy_network
    command: sh -c "pnpm start"

  nginx:
    image: nginx:latest
    container_name: academy_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
      - ./nginx/server.crt:/etc/nginx/server.crt:ro
      - ./nginx/server.key:/etc/nginx/server.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - academy_network


networks:
  academy_network:
    driver: bridge

volumes:
  postgres_data:
  backend_static:
  backend_media: