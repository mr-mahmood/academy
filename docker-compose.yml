services:
  postgres:
    image: postgres:17
    container_name: academy_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 60s
      timeout: 10s
      retries: 5

  # Redis (for caching and sessions)
  redis:
    image: redis:latest
    container_name: academy_redis
    restart: always
    networks:
      - academy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Backend (Django)
  backend:
    build: ./backend
    image: mrmahmood/academy-backend:latest 
    container_name: academy_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - ./backend/media:/app/media 
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    networks:
      - academy_network
    command: >
      sh -c "
        python manage.py collectstatic --noinput
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  # Frontend (Next.js)
  frontend:
    build: ./frontend
    image: mrmahmood/academy-frontend:latest
    container_name: academy_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next 
    depends_on:
      - backend
    networks:
      - academy_network
    command: sh -c "pnpm dev"
      

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:latest
    container_name: academy_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/static:ro  # Mount static files for nginx
      - ./backend/media:/media:ro    # Mount media files for nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    #   - frontend
    networks:
      - academy_network

networks:
  academy_network:
    driver: bridge

volumes:
  postgres_data: