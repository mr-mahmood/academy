log_format timed '$remote_addr - $request '
                 'rt=$request_time '
                 'urt=$upstream_response_time '
                 'status=$status ';

upstream backend {
    server backend:8000;
    keepalive 32;
}

# ============================================
# UPSTREAM FRONTEND (Next.js)
# ============================================
upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# ============================================
# HTTP SERVER (Port 80) - Development mode
# Use this for local development without HTTPS
# ============================================
server {
    listen 80;
    server_name _;
    
    # Disable gzip compression entirely
    gzip off;
    
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Django static files - Now using /static/
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Django media files - Now using /media/
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    
    # API requests
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Disable buffering for API responses
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Admin panel
    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for admin
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Frontend static files
    location /_next/static {
        proxy_pass http://frontend;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
        
        # Disable buffering for static files
        proxy_buffering off;
    }
    # Everything else goes to Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable all buffering for immediate response
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        
        # Disable gzip compression to prevent compression delays
        gzip off;
        
        # Optimize timeouts for faster responses
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        
        # Enable keepalive for better performance
        proxy_set_header Connection "";
        
        # Add timing headers for debugging
        add_header X-Proxy-Buffering "disabled" always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header X-Request-Time $request_time always;
    }
    
    access_log /var/log/nginx/access.log timed;
}

# ============================================
# HTTP SERVER (Port 80) - Development mode
# Use this for local development without HTTPS
# ============================================


