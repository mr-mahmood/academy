log_format timed '$remote_addr - $request '
                 'rt=$request_time '
                 'urt=$upstream_response_time '
                 'status=$status ';

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name academy.sepahansc.com;
    
    limit_req zone=general burst=30 nodelay;
    limit_req_status 429;
    
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name academy.sepahansc.com;
    
    ssl_certificate /etc/nginx/server.crt;
    ssl_certificate_key /etc/nginx/server.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    gzip off;
    client_max_body_size 10M;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    error_page 429 /rate_limit.html;
    location = /rate_limit.html {
        return 429 '<!DOCTYPE html><html><head><title>Rate Limit Exceeded</title></head><body><h1>429 - Too Many Requests</h1><p>Please slow down and try again later.</p></body></html>';
        add_header Content-Type text/html;
    }
    
    # Static files - 100 per second
    location /static/ {
        limit_req zone=static burst=200 nodelay;
        limit_req_status 429;
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        limit_req zone=static burst=100 nodelay;
        limit_req_status 429;
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /_next/static {
        limit_req zone=static burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
        proxy_buffering off;
    }
    
    # API - 20 per second
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Upstream-Time $upstream_response_time always;
    }
    
    location /admin/ {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        add_header X-Proxy-Buffering "disabled" always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header X-Request-Time $request_time always;
    }
    
    access_log /var/log/nginx/access.log timed;
}